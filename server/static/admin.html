<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics - AI Cashier</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/landing.css">
<link rel="stylesheet" href="/static/css/dash.css">
</head>
<body>
<div class="page"><div class="page__inner">

  <header data-mast></header>

  <div class="title">
    <p class="title__eyebrow">Business</p>
    <h1>Analytics</h1>
    <p>Every confirmed sale, priced from the same product file the till uses. Figures refresh every 30 seconds.</p>
  </div>

  <section class="figures" aria-label="Takings">
    <div class="figure">
      <div class="figure__n" id="totalRevenue">฿0</div>
      <div class="figure__k">total takings</div>
      <div class="figure__d up" id="growthContainer"><span id="growthArrow">▲</span> <span id="revenueGrowth">0%</span> vs yesterday</div>
    </div>
    <div class="figure"><div class="figure__n" id="todaySales">0</div><div class="figure__k">sales today</div></div>
    <div class="figure"><div class="figure__n" id="avgOrder">฿0</div><div class="figure__k">average basket</div></div>
  </section>

  <div class="split">
    <section class="panel" aria-labelledby="bs">
      <div class="panel__head"><h2 id="bs">Best sellers</h2><span class="panel__note">by revenue</span></div>
      <div id="bestSellersRanking" class="best-sellers-list"></div>
    </section>

    <section class="panel" aria-labelledby="rt">
      <div class="panel__head"><h2 id="rt">Recent transactions</h2><span class="panel__note">last 10</span></div>
      <div id="recentTransactions" style="max-height:420px;overflow-y:auto"></div>
    </section>
  </div>

</div></div>

<script src="/static/js/mast.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
