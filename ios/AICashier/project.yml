# xcodegen project definition.  `xcodegen generate` writes AICashier.xcodeproj.
name: AICashier
options:
  bundleIdPrefix: com.group3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    # the proposer is plain Swift loops over a 720p frame: unoptimised Debug
    # code takes ~18 s per frame, optimised well under a second
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    SWIFT_COMPILATION_MODE: wholemodule
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "4.1.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AICashier:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: AI Cashier
        NSCameraUsageDescription: The camera looks at the products on the mat. No picture is ever kept.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.group3.aicashier
  AICashierTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AICashier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.group3.aicashier.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AICashier:
    build:
      targets:
        AICashier: all
        AICashierTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AICashierTests]
